<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 10px; font-size: 14px; color: #333; }
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; }
      input { width: 90%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
      button { background-color: #E67E22; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
      button:hover { background-color: #D35400; }
    </style>
  </head>
  <body>
    <div class="form-group">
      <label for="startRow">Начальная строка: минимум 3</label>
      <input type="number" id="startRow" value="3">
    </div>
    <div class="form-group">
      <label for="endRow">Конечная строка (пусто — до конца):</label>
      <input type="number" id="endRow" placeholder="Все строки">
    </div>
    <button onclick="downloadXml()">Сгенерировать и скачать XML</button>

    <script>
      function downloadXml() {
        var start = document.getElementById('startRow').value;
        var end = document.getElementById('endRow').value;

        google.script.run.withSuccessHandler(function(xmlContent) {
          var blob = new Blob([xmlContent], {type: "text/xml;charset=utf-8"});
          var url  = URL.createObjectURL(blob);

          var a = document.createElement('a');
          a.href = url;
          // Формируем имя файла с текущей датой
          var dateStr = new Date().toISOString().slice(0,10);
          a.download = "fsa_upload_" + dateStr + ".xml";

          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          google.script.host.close();
        }).generateFsaXml(start, end);
      }
    </script>
  </body>
</html>
