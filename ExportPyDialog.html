<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 10px; font-size: 14px; color: #333; }
      .form-group { margin-bottom: 15px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; }
      input { width: 90%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
      button { background-color: #4CAF50; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
      button:hover { background-color: #45a049; }
    </style>
  </head>
  <body>
    <div class="form-group">
      <label for="startRow">Начальная строка: минимум 3</label>
      <input type="number" id="startRow" value="3">
    </div>
    <div class="form-group">
      <label for="endRow">Конечная строка (пусто — до конца):</label>
      <input type="number" id="endRow" placeholder="Все строки">
    </div>
    <button onclick="downloadPythonScript()">Скачать скрипт .py</button>

    <script>
      function downloadPythonScript() {
        var start = document.getElementById('startRow').value;
        var end = document.getElementById('endRow').value;

        google.script.run.withSuccessHandler(function(pythonCode) {
          var blob = new Blob([pythonCode], {type: "text/plain;charset=utf-8"});
          var url  = URL.createObjectURL(blob);

          var a = document.createElement('a');
          a.href = url;
          a.download = "requestArshin.py";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);

          google.script.host.close();
        }).generatePythonScriptArshin(start, end);
      }
    </script>
  </body>
</html>
